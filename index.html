<title>Pflege-Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: ein Bildschirm pro Schritt, zentrierte Karte, große Touch-Flächen für iPad quer und hoch */
:root {
  --bg: #e9f5f6;
  --card: #ffffff;
  --ink: #0e2d3b;
  --ink-soft: #4b6773;
  --petrol: #0a6c7e;
  --teal: #12a4a8;
  --mist: #d5eef0;
  --line: #c3dfe3;
  --good: #1b8f62;
  --good-bg: #dff4ea;
  --soft-no: #c4533f;
  --soft-no-bg: #fbe7e2;
  --tip-bg: #fff4d6;
  --tip-ink: #6b4b00;
  --font: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 22px;
  line-height: 1.4;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow: hidden;
}
#app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-block: 16px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  gap: 16px;
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 48px;
}
.brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 26px; color: var(--petrol); letter-spacing: .01em; }
.brand svg { width: 40px; height: 40px; }
.hdr-right { display: flex; align-items: center; gap: 12px; }
.pill {
  border: 2px solid var(--line); background: var(--card); color: var(--ink-soft);
  font: 700 17px var(--font); padding: 10px 16px; border-radius: 999px; cursor: pointer; min-height: 44px;
}
.pill[aria-pressed="true"] { background: var(--tip-bg); border-color: #e8c96a; color: var(--tip-ink); }
.progress { display: flex; gap: 6px; }
.progress i { width: 26px; height: 8px; border-radius: 4px; background: var(--line); }
.progress i.done { background: var(--teal); }
.progress i.now { background: var(--petrol); }

main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.card {
  width: 100%; max-width: 980px; max-height: 100%;
  background: var(--card); border-radius: 28px;
  padding: clamp(24px, 4vh, 44px) clamp(24px, 4vw, 56px);
  box-shadow: 0 10px 40px rgba(10, 80, 95, .12);
  display: flex; flex-direction: column; gap: 22px;
  overflow: auto;
}
.eyebrow { font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
h1 { margin: 0; font-size: clamp(38px, 6vw, 62px); line-height: 1.05; font-weight: 900; text-wrap: balance; }
h2 { margin: 0; font-size: clamp(28px, 3.9vw, 40px); line-height: 1.18; font-weight: 800; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
.lead { font-size: 26px; color: var(--ink-soft); max-width: 36ch; }

.btn {
  font: 800 26px var(--font); border: 0; border-radius: 20px; cursor: pointer;
  min-height: 76px; padding: 14px 32px; color: #fff; background: var(--petrol);
  transition: transform .08s ease, filter .15s ease;
}
.btn:active { transform: scale(.97); }
.btn:focus-visible, .pill:focus-visible, .opt:focus-visible { outline: 4px solid var(--teal); outline-offset: 3px; }
.btn.alt { background: var(--mist); color: var(--petrol); }
.btn-row { display: flex; gap: 16px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 260px; }

.hero-line { width: min(520px, 100%); height: 70px; }
.hero-line path { stroke: var(--teal); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.badges { display: flex; gap: 12px; flex-wrap: wrap; }
.badge { background: var(--mist); color: var(--petrol); font-weight: 800; font-size: 18px; padding: 8px 16px; border-radius: 999px; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.opt {
  font: 800 28px var(--font); border: 3px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 22px; min-height: 104px; padding: 16px 22px; cursor: pointer; text-align: center;
  transition: transform .08s ease, border-color .15s ease, background .15s ease;
}
.opt:active { transform: scale(.97); }
.opt.yes { border-color: #9bd8c0; } .opt.no { border-color: #efb9ad; }
.grid4 { grid-template-columns: 1fr 1fr; }
.grid4 .opt { font-size: 23px; min-height: 96px; font-weight: 700; text-align: left; }

.verdict { display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 20px; font-weight: 900; font-size: 30px; }
.verdict.good { background: var(--good-bg); color: var(--good); }
.verdict.nope { background: var(--soft-no-bg); color: var(--soft-no); }
.verdict svg { width: 38px; height: 38px; flex: none; }
.why { font-size: 25px; }
.tip { background: var(--tip-bg); color: var(--tip-ink); border-radius: 18px; padding: 16px 22px; font-size: 21px; }
.tip b { display: block; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }

.score { font-size: clamp(64px, 11vw, 110px); font-weight: 900; line-height: 1; color: var(--petrol); }
.score small { font-size: .35em; color: var(--ink-soft); font-weight: 800; }
.cta { background: var(--mist); border-radius: 20px; padding: 18px 24px; font-size: 24px; font-weight: 800; color: var(--petrol); }

.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 18px; z-index: 5; }

.fade { animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade, .hero-line path { animation: none; stroke-dashoffset: 0; }
}
@media (max-width: 640px) {
  .answers, .grid4 { grid-template-columns: 1fr; }
  body { font-size: 19px; }
}
@media (max-height: 640px) {
  .lead, .why { font-size: 20px; } .opt { min-height: 80px; } .btn { min-height: 64px; }
}
</style>

<div id="app">
  <header>
    <div class="brand" id="logo" role="button" aria-label="Pflege-Check">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0a6c7e"/><path d="M17 8h6v9h9v6h-9v9h-6v-9H8v-6h9z" fill="#fff"/></svg>
      <span>Pflege-Check</span>
    </div>
    <div class="hdr-right">
      <div class="progress" id="progress" aria-hidden="true"></div>
    </div>
  </header>
  <main id="screen"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const QUIZ = [
  { q: "Ein gesunder Erwachsener hat in Ruhe etwa 60 bis 100 Herzschläge pro Minute.", a: true,
    why: "Stimmt. Bei Fieber, Aufregung oder Schmerzen schlägt das Herz schneller. Gut trainierte Sportler liegen oft darunter. Pflegekräfte messen den Puls an der Speichenarterie am Handgelenk.",
    tip: "Frag: Soll ich dir zeigen, wo man den Puls am Handgelenk fühlt? Dann gleich gemeinsam messen." },
  { q: "In der Pflege wirkt die Händedesinfektion meist besser als nur Händewaschen.", a: true,
    why: "Stimmt. Das Mittel wird 30 Sekunden eingerieben und tötet Keime sicherer ab. Seife und Wasser nimmt man bei sichtbarem Schmutz und zusätzlich bei Magen-Darm-Infekten.",
    tip: "Frag: Wie oft am Tag desinfizierst du dir wohl die Hände, wenn du auf Station arbeitest?" },
  { q: "Ein Druckgeschwür (Dekubitus) kann schon nach wenigen Stunden ohne Lagewechsel entstehen.", a: true,
    why: "Stimmt. Wer nicht allein die Position wechseln kann, wird regelmäßig umgelagert. Das ist eine der wichtigsten Aufgaben der Pflege. Gelagert wird oft alle 2 bis 4 Stunden, je nach Risiko.",
    tip: "Frag: Hast du schon mal erlebt, dass ein Angehöriger lange liegen musste?" },
  { q: "Ältere Menschen brauchen weniger zu trinken als jüngere.", a: false,
    why: "Stimmt nicht. Das Durstgefühl lässt im Alter nach, der Bedarf bleibt. Als Richtwert gelten etwa 1,5 Liter am Tag, außer der Arzt hat wegen einer Erkrankung etwas anderes festgelegt.",
    tip: "Frag: Wie viel hast du heute schon getrunken? Wenn es wenig ist, ein Glas Wasser anbieten." },
  { q: "Eine bewusstlose Person, die normal atmet, legt man flach auf den Rücken.", a: false,
    why: "Stimmt nicht. Sie kommt in die stabile Seitenlage, damit die Atemwege frei bleiben und nichts in die Lunge läuft. Atmet sie nicht normal, ruft man den Notruf 112 und beginnt mit der Herzdruckmassage.",
    tip: "Frag: Wüsstest du, was du als Erstes tun würdest? Wir zeigen dir die Seitenlage an der Puppe." },
  { q: "Bei der Herzdruckmassage drückt man etwa 100- bis 120-mal pro Minute auf die Brustmitte.", a: true,
    why: "Stimmt. Der Takt passt zu Liedern wie „Stayin' Alive“. Man drückt etwa 5 bis 6 Zentimeter tief. Auch ohne Beatmung hilft das, bis der Rettungsdienst da ist.",
    tip: "Frag: Hast du einen Erste-Hilfe-Kurs gemacht? Wann war der?" },
  { q: "Bettruhe ist für ältere Menschen immer die beste Erholung.", a: false,
    why: "Stimmt nicht. Schon wenige Tage im Bett lassen die Muskeln spürbar schwächer werden. Darum holt die Pflege Menschen so früh wie möglich wieder auf die Beine, zum Beispiel für kurze Wege.",
    tip: "Frag: Was machst du, um selbst fit zu bleiben? Das gilt für alle Altersgruppen." },
  { q: "Gutes Licht, feste Schuhe und freie Wege senken das Sturzrisiko spürbar.", a: true,
    why: "Stimmt. Stürze sind einer der häufigsten Gründe für Krankenhausaufenthalte älterer Menschen. Mit einfachen Mitteln lässt sich viel verhindern. Das nennt man Sturzprophylaxe.",
    tip: "Frag: Fällt dir etwas bei dir zuhause ein, über das man stolpern könnte?" }
];

const TYPES = {
  B: { name: "Der Beruhiger", icon: "💙",
       text: "Du hörst zu, bleibst ruhig und gibst anderen Sicherheit. Menschen fühlen sich bei dir gut aufgehoben.",
       fields: ["Altenpflege", "Ambulante Pflege", "Palliativ", "Demenzbegleitung"],
       tip: "Frag: Wann hat dir zuletzt jemand zugehört, und wie hat sich das angefühlt?" },
  M: { name: "Der Macher", icon: "⚡",
       text: "Du packst an, behältst den Überblick und entscheidest schnell, auch wenn es hektisch wird.",
       fields: ["Notaufnahme", "Intensivstation", "OP-Pflege", "Rettungsdienst"],
       tip: "Frag: Welche Situation hat dich zuletzt richtig herausgefordert?" },
  T: { name: "Der Tüftler", icon: "🔬",
       text: "Du willst verstehen, wie etwas funktioniert. Technik, Zahlen und Fachwissen machen dir Spaß.",
       fields: ["Intensivpflege", "Anästhesie", "Dialyse", "Wundmanagement"],
       tip: "Frag: Welches Gerät im Krankenhaus würdest du gern mal bedienen?" },
  S: { name: "Der Teamspieler", icon: "🤝",
       text: "Du bist gern mit anderen unterwegs und teilst Erfolge. Zusammen schafft ihr mehr als allein.",
       fields: ["Stationspflege", "Wohngruppen", "Kinderkrankenpflege", "Pflegeberatung"],
       tip: "Frag: In welchem Team hast du dich bisher am wohlsten gefühlt?" }
};
const TYPE_Q = [
  { q: "Was gibt dir das beste Gefühl, nachdem du jemandem geholfen hast?",
    o: [["Ein dankbares Lächeln", "B"], ["Das Problem ist gelöst", "M"], ["Ich habe verstanden, warum es passiert ist", "T"], ["Wir haben es zusammen geschafft", "S"]] },
  { q: "Wie sieht dein perfekter Arbeitstag aus?",
    o: [["Ruhig, mit Zeit für persönliche Gespräche", "B"], ["Abwechslungsreich und mit Tempo", "M"], ["Mit Fachwissen, Geräten und kniffligen Fällen", "T"], ["Mit netten Kolleginnen und Kollegen", "S"]] },
  { q: "Jemand ist nervös vor einer Untersuchung. Was tust du?",
    o: [["Ich höre zu und bleibe bei ihm", "B"], ["Ich sorge dafür, dass alles zügig läuft", "M"], ["Ich erkläre den Ablauf Schritt für Schritt", "T"], ["Ich hole eine Kollegin dazu, die helfen kann", "S"]] },
  { q: "Was machst du am liebsten in deiner Freizeit?",
    o: [["Mit Freunden reden", "B"], ["Sport oder etwas Aufregendes", "M"], ["Basteln, Spiele oder Krimis lösen", "T"], ["Etwas im Verein oder in der Gruppe", "S"]] },
  { q: "Im Notfall bist du die Person, die …",
    o: [["alle beruhigt", "B"], ["sofort handelt", "M"], ["erst klar einschätzt, was los ist", "T"], ["alle koordiniert", "S"]] }
];

const $ = s => document.querySelector(s);
const screen = $('#screen');
let state = { step: 'start', i: 0, score: 0, answered: null, tAns: [], tIdx: 0 };
let idle = null;

const ICON_OK = '<svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="19" fill="currentColor"/><path d="M10 19.5l6 6 12-13" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_HM = '<svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="19" fill="currentColor"/><path d="M19 9v13M19 27.5v1" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg>';

function setProgress(n, cur) {
  const el = $('#progress');
  el.innerHTML = n ? Array.from({ length: n }, (_, k) => `<i class="${k < cur ? 'done' : k === cur ? 'now' : ''}"></i>`).join('') : '';
}
function tipHtml() { return ''; }

function resetIdle() {
  clearTimeout(idle);
  if (state.step !== 'start') idle = setTimeout(() => go('start'), 60000);
}

function go(step) { state.step = step; render(); resetIdle(); }

function render() {
  const s = state.step;
  if (s === 'start') {
    setProgress(0);
    state = { step: 'start', i: 0, score: 0, answered: null, tAns: [], tIdx: 0 };
    screen.innerHTML = `<section class="card fade">
      <div class="eyebrow">Mitmachen und Ausprobieren</div>
      <svg class="hero-line" viewBox="0 0 520 70" aria-hidden="true"><path d="M0 40 H150 L175 40 L195 8 L225 62 L250 22 L268 40 H520"/></svg>
      <h1>Wie fit bist du<br>in Pflege?</h1>
      <p class="lead">8 kurze Fragen, 2 Minuten. Du brauchst kein Vorwissen, wir erklären alles.</p>
      <div class="badges"><span class="badge">Kein Vorwissen nötig</span><span class="badge">Keine Anmeldung</span><span class="badge">Nur ca. 2 Minuten</span></div>
      <button class="btn" data-act="begin">Los geht’s</button>
    </section>`;
  } else if (s === 'q') {
    const q = QUIZ[state.i];
    setProgress(QUIZ.length, state.i);
    if (state.answered === null) {
      screen.innerHTML = `<section class="card fade">
        <div class="eyebrow">Frage ${state.i + 1} von ${QUIZ.length} · Stimmt das?</div>
        <h2>${q.q}</h2>
        <div class="answers">
          <button class="opt yes" data-act="ans" data-v="1">Stimmt</button>
          <button class="opt no" data-act="ans" data-v="0">Stimmt nicht</button>
        </div></section>`;
    } else {
      const ok = state.answered === q.a;
      const last = state.i === QUIZ.length - 1;
      screen.innerHTML = `<section class="card fade">
        <div class="verdict ${ok ? 'good' : 'nope'}">${ok ? ICON_OK : ICON_HM}<span>${ok ? 'Richtig!' : 'Gute Frage, das weiß fast niemand.'}</span></div>
        <p class="why">${q.why}</p>
        ${tipHtml(q.tip)}
        <button class="btn" data-act="next">${last ? 'Ergebnis ansehen' : 'Nächste Frage'}</button>
      </section>`;
    }
  } else if (s === 'result') {
    setProgress(QUIZ.length, QUIZ.length);
    const n = state.score;
    const lvl = n >= 7 ? ['Pflege-Profi', 'Beeindruckend. Du hast schon ein Gespür für Pflege.']
              : n >= 4 ? ['Pflege-Talent', 'Starke Leistung. Mit etwas Praxis wirst du richtig gut.']
              : ['Pflege-Entdecker', 'Ein guter Anfang. Alles Weitere lernst du in der Ausbildung Schritt für Schritt.'];
    screen.innerHTML = `<section class="card fade">
      <div class="eyebrow">Dein Ergebnis</div>
      <div class="score">${n}<small> von ${QUIZ.length}</small></div>
      <h2>${lvl[0]}</h2>
      <p class="lead">${lvl[1]}</p>
      ${tipHtml('Frag: Welche Antwort hat dich am meisten überrascht? Daran kannst du das Gespräch aufhängen.')}
      <div class="btn-row"><button class="btn" data-act="typeBegin">Welcher Pflege-Typ bist du?</button><button class="btn alt" data-act="restart">Fertig</button></div>
    </section>`;
  } else if (s === 'type') {
    const t = TYPE_Q[state.tIdx];
    setProgress(TYPE_Q.length, state.tIdx);
    screen.innerHTML = `<section class="card fade">
      <div class="eyebrow">Pflege-Typ · Frage ${state.tIdx + 1} von ${TYPE_Q.length} · Kein Richtig oder Falsch</div>
      <h2>${t.q}</h2>
      <div class="answers grid4">${t.o.map(([txt, k]) => `<button class="opt" data-act="tans" data-k="${k}">${txt}</button>`).join('')}</div>
    </section>`;
  } else if (s === 'typeResult') {
    setProgress(TYPE_Q.length, TYPE_Q.length);
    const c = { B: 0, M: 0, T: 0, S: 0 };
    state.tAns.forEach(k => c[k]++);
    const top = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
    const t = TYPES[top];
    screen.innerHTML = `<section class="card fade">
      <div class="eyebrow">Dein Pflege-Typ</div>
      <h1>${t.icon} ${t.name}</h1>
      <p class="lead">${t.text}</p>
      <div><div class="eyebrow" style="margin-bottom:10px">Hier fühlst du dich wohl</div><div class="badges">${t.fields.map(f => `<span class="badge">${f}</span>`).join('')}</div></div>
      <div class="cta">Lust auf mehr? Sprich mit unseren Azubis, sie erzählen dir, wie die Ausbildung wirklich ist.</div>
      ${tipHtml(t.tip)}
      <button class="btn" data-act="restart">Fertig, nächster Besucher</button>
    </section>`;
  }
}

function countRun() {
  try { localStorage.setItem('pc_runs', String((+localStorage.getItem('pc_runs') || 0) + 1)); } catch (e) {}
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'begin') { state.i = 0; state.score = 0; state.answered = null; go('q'); }
  else if (act === 'ans' && state.answered === null) {
    state.answered = b.dataset.v === '1';
    if (state.answered === QUIZ[state.i].a) state.score++;
    render();
  }
  else if (act === 'next') {
    state.answered = null;
    if (state.i < QUIZ.length - 1) { state.i++; render(); } else { countRun(); go('result'); }
  }
  else if (act === 'typeBegin') { state.tIdx = 0; state.tAns = []; go('type'); }
  else if (act === 'tans') {
    state.tAns.push(b.dataset.k);
    if (state.tIdx < TYPE_Q.length - 1) { state.tIdx++; render(); } else go('typeResult');
  }
  else if (act === 'restart') go('start');
});

['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle));


// Verdeckter Zähler: 5x schnell auf das Logo tippen
let taps = [];
$('#logo').addEventListener('click', () => {
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000).concat(now);
  if (taps.length >= 5) {
    taps = [];
    let n = 0; try { n = +localStorage.getItem('pc_runs') || 0; } catch (e) {}
    const t = $('#toast'); t.textContent = 'Abgeschlossene Quiz-Durchläufe: ' + n; t.hidden = false;
    setTimeout(() => { t.hidden = true; }, 3500);
  }
});

render();
</script>
